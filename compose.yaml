name: reviewer-notifier

services:
  notifier:
    container_name: reviewer-item-notifier
    image: reviewer-notifier:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./notifier.env
    environment:
      BIND_HOST: 0.0.0.0
      CONTAINER_LOOPBACK_ONLY: "true"
      PORT: 8787
      STATE_PATH: /app/data/seen.json
      USER_RULES_PATH: /app/data/rules.json
      # SQLite on the Windows bind mount is ~13x slower per query. Databases
      # live on a named volume; logs/config stay in ./data/discord_bridge.
      DISCORD_QUEUE_PATH: /app/db/collector.sqlite3
      DISCORD_WELCOME_PATH: /app/db/welcome.sqlite3
      DISCORD_MEMBERSHIP_PATH: /app/db/membership.sqlite3
      # Referral + Pro-grant ledgers (copied over from ./data/discord_bridge on
      # first start; the old files stay there as a backup).
      DISCORD_BILLING_DB_DIR: /app/db
      DISCORD_PRIVATE_DIR: /app/data/discord_bridge
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      - type: volume
        source: discord-db
        target: /app/db
    init: true
    read_only: true
    tmpfs:
      # SQLite spills sorts/GROUP BY temp files here; 16m filled up on big queries.
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, os, urllib.request;
          request = urllib.request.Request(
          'http://127.0.0.1:8787/health',
          headers={'X-Ingest-Token': os.getenv('INGEST_TOKEN', '')});
          response = json.load(urllib.request.urlopen(request, timeout=3));
          assert response.get('notifier_configured'), 'notification provider is not configured'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 2s

volumes:
  discord-db:
