name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r src/requirements.txt pytest ruff
      - run: ruff check .
      - run: python -m pytest -q
      # The server must actually start. A syntax-clean module that dies on
      # import is still a broken deliverable.
      - run: python src/server.py --help

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Cheap syntax gate: a typo in the service worker is otherwise only
      # visible as a silently dead relay.
      - run: for f in extension/*.js verification_helper/*.js; do node --check "$f"; done
      - run: node --test tests/test_extension_runtime.mjs tests/test_extension_discord.mjs tests/test_scan_timing.mjs tests/test_challenge_evidence.mjs tests/test_verification_watch.mjs tests/test_verification_assist.mjs tests/test_verification_automation.mjs tests/test_integrated_verification.mjs tests/test_native_verification.mjs tests/test_facet_controls.mjs tests/test_facet_input.mjs tests/test_department_data.mjs tests/test_auxiliary_options.mjs tests/test_auxiliary_scans.mjs tests/test_tab_workspace.mjs tests/test_scanner_control.mjs tests/test_page_scroll.mjs tests/test_scan_metrics.mjs
      - run: python3 -c "import json; json.load(open('extension/manifest.json'))"
      - run: python3 -c "import json; json.load(open('verification_helper/manifest.json'))"
