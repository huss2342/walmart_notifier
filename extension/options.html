<!doctype html>
<meta charset="utf-8">
<title>Reviewer Item Relay - Settings</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  input { width: 100%; padding: .5rem; margin-top: .25rem; font: inherit;
          border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
  button { margin-top: 1.25rem; padding: .5rem 1.25rem; font: inherit;
           background: #0071dc; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  .hint { color: #666; font-weight: 400; font-size: .85em; }
  #saved { margin-left: .75rem; color: #087443; }
  #pathError { color: #b3261e; font-weight: 400; font-size: .85em; }
  .status { margin-top: 2rem; padding: .75rem 1rem; border-radius: 6px;
            background: #f4f6f8; border: 1px solid #e2e6ea; }
  .status h2 { margin: 0 0 .5rem; font-size: 1em; }
  .ok { color: #087443; } .warn { color: #a15c00; } .bad { color: #b3261e; }
</style>
<h1>Reviewer Item Relay</h1>
<p class="hint">
  Reads items from the reviewer page you already have open and signed in, and
  posts them to the notifier running on this machine. No Walmart credentials
  are stored here, and nothing leaves your computer except the push
  notification itself.
</p>

<label>Ingest endpoint
  <span class="hint">Where <code>python src/server.py</code> is listening. Leave the default unless you changed the port.</span>
  <input id="endpoint" type="url" placeholder="http://127.0.0.1:8787/ingest">
</label>

<label>Ingest token
  <span class="hint">Matches the <code>INGEST_TOKEN</code> environment variable. Optional - the server only listens on loopback.</span>
  <input id="token" type="password" placeholder="optional shared secret">
</label>

<label>Reviewer page path
  <span class="hint">
    A regular expression matched against the URL path of the page to read and
    reload. The default matches <code>/reviews/claim-product</code>. Order and
    returns pages are always excluded, so the relay never reports your own past
    purchases as new items.
  </span>
  <input id="pathPattern" type="text" placeholder="^/reviews/claim-product">
  <span id="pathError"></span>
</label>

<label>Auto-refresh every (minutes)
  <span class="hint">
    Reloads the reviewer tab on its own so you can leave it open and walk away.
    <strong>0 disables it</strong> — the relay then only reads the page when you
    load it yourself. A reload is deferred while you are actively clicking or
    scrolling, so it will not interrupt a claim. Chrome will not schedule an
    alarm below one minute.
  </span>
  <input id="refreshMinutes" type="number" min="0" max="120" step="1" placeholder="0">
</label>

<button id="save">Save</button><span id="saved"></span>

<div class="status">
  <h2>Status</h2>
  <div id="status">Loading…</div>
</div>

<script src="options.js"></script>
