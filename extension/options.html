<!doctype html>
<meta charset="utf-8">
<title>Reviewer Item Relay - Settings</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 38rem; margin: 2rem auto; padding: 0 1rem; }
  h2 { margin: 2.5rem 0 .25rem; font-size: 1.05em; border-bottom: 1px solid #e2e6ea; padding-bottom: .4rem; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  input, select { width: 100%; padding: .5rem; margin-top: .25rem; font: inherit;
          border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
  input[type=checkbox] { width: auto; margin-right: .4rem; vertical-align: -2px; }
  button { margin-top: 1.25rem; padding: .5rem 1.25rem; font: inherit;
           background: #0071dc; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  button.secondary { background: #eef1f4; color: #2b3137; }
  .row { display: flex; gap: .75rem; }
  .row > label { flex: 1; }
  .hint { color: #666; font-weight: 400; font-size: .85em; }
  .saved { margin-left: .75rem; color: #087443; font-weight: 600; }
  .err { color: #b3261e; font-weight: 400; font-size: .85em; }
  .status { margin-top: 1rem; padding: .75rem 1rem; border-radius: 6px;
            background: #f4f6f8; border: 1px solid #e2e6ea; }
  .status h2 { margin: 0 0 .5rem; font-size: 1em; border: 0; padding: 0; }
  .ok { color: #087443; } .warn { color: #a15c00; } .bad { color: #b3261e; }
  .banner { margin-top: .75rem; padding: .6rem .8rem; border-radius: 5px;
            background: #fff8e6; border: 1px solid #f0dca8; font-size: .9em; }
</style>

<h1>Reviewer Item Relay</h1>
<p class="hint">
  Reads the reviewer page you have open and posts what it finds to the
  notifier on this machine. No Walmart credentials stored.
</p>

<h2>Alert filters</h2>
<p class="hint">
  Stored on the notifier. Applied on the next relay, no restart.
</p>

<div id="rulesBanner"></div>

<div class="row">
  <label>Minimum value ($)
    <span class="hint">Alert only at or above this retail value.</span>
    <input id="minValue" type="number" min="0" step="0.01" placeholder="25">
  </label>
  <label>Maximum value ($)
    <span class="hint">Optional upper bound.</span>
    <input id="maxValue" type="number" min="0" step="0.01" placeholder="(none)">
  </label>
</div>

<label>Item name must contain
  <span class="hint">Comma separated, matches any. Blank = allow everything.</span>
  <input id="keywords" type="text" placeholder="headphones, air fryer, tool">
</label>

<label>Never alert on
  <span class="hint">Comma separated. Wins over the list above.</span>
  <input id="excludeKeywords" type="text" placeholder="toy, kids, baby, gift card">
</label>

<label>Priority
  <span class="hint">Notification priority.</span>
  <select id="priority">
    <option value="low">Low — silent</option>
    <option value="normal" selected>Normal</option>
    <option value="high">High</option>
    <option value="urgent">Urgent</option>
  </select>
</label>

<label style="font-weight:400;">
  <input id="alertUnknown" type="checkbox">
  Also alert on items with no listed value
  <span class="hint">Some listings show no figure at all.</span>
</label>

<button id="saveRules">Save filters</button>
<button id="resetRules" class="secondary" type="button">Reset to defaults</button>
<span id="rulesSaved" class="saved"></span>
<div id="rulesError" class="err"></div>

<h2>Connection</h2>

<label>Ingest endpoint
  <span class="hint">Where <code>run.ps1</code> listens.</span>
  <input id="endpoint" type="url" placeholder="http://127.0.0.1:8787/ingest">
</label>

<label>Ingest token
  <span class="hint">Optional. Matches <code>INGEST_TOKEN</code>.</span>
  <input id="token" type="password" placeholder="optional shared secret">
</label>

<label>Reviewer page path
  <span class="hint">Regex on the URL path. Order and returns pages always excluded.</span>
  <input id="pathPattern" type="text" placeholder="^/reviews/claim-product">
  <span id="pathError" class="err"></span>
</label>

<label>Delay between pages (seconds)
  <span class="hint">Every sweep walks page 1 to the end. This paces it.</span>
  <input id="pageDelaySeconds" type="number" min="1" max="60" step="1" placeholder="5">
</label>

<label>Auto-refresh every (minutes)
  <span class="hint">
    Restarts the sweep at page 1. <strong>0 disables it.</strong> Deferred while
    you are clicking or scrolling. Minimum 1.
  </span>
  <input id="refreshMinutes" type="number" min="0" max="120" step="1" placeholder="0">
</label>

<button id="save">Save connection settings</button><span id="saved" class="saved"></span>

<div class="status">
  <h2>Status</h2>
  <div id="status">Loading…</div>
</div>

<script src="options.js"></script>
