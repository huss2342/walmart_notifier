<!doctype html>
<meta charset="utf-8">
<title>Reviewer Item Relay - Settings</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  input { width: 100%; padding: .5rem; margin-top: .25rem; font: inherit;
          border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
  button { margin-top: 1.25rem; padding: .5rem 1.25rem; font: inherit;
           background: #0071dc; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  .hint { color: #666; font-weight: 400; font-size: .85em; }
  #status { margin-left: .75rem; color: #087443; }
</style>
<h1>Reviewer Item Relay</h1>
<p class="hint">
  Reads items from the reviewer page you already have open and signed in, and
  posts them to your own notifier. No Walmart credentials are stored here.
</p>
<label>Ingest endpoint
  <span class="hint">The <code>ingestUrl</code> printed by <code>infra/deploy.sh</code>, including its <code>?code=</code> function key.</span>
  <input id="endpoint" type="url" placeholder="https://wmrev-func-abc123.azurewebsites.net/api/ingest?code=...">
</label>
<label>Ingest token
  <span class="hint">Matches the <code>INGEST_TOKEN</code> app setting. Optional.</span>
  <input id="token" type="password" placeholder="optional shared secret">
</label>
<button id="save">Save</button><span id="status"></span>
<script src="options.js"></script>
